spec:
  inputs:
    only_doc_and_pages:
      type: boolean
      default: false
      description: "Skip all jobs except build_doc and pages. Can be passed in a git push with -o ci.input='only_doc_and_pages=true'"

---

image: "registry.gitlab.com/mia_jinns/docker-image-quarto-jax-sphinx:main"

stages:
  - linting
  - tests
  - build
  - publish

.default_rules:
  rules:
    - if: $[[ inputs.only_doc_and_pages ]] == false

.base_ruff: # from https://docs.astral.sh/ruff/integrations/#github-actions
  stage: linting
  interruptible: true
  image:
    name: ghcr.io/astral-sh/ruff:0.11.8-alpine
  before_script:
    - ruff --version
  rules:
    - !reference [.default_rules, rules]

Ruff Check:
  extends: .base_ruff
  script:
    - ruff check jinns --output-format=gitlab > code-quality-report.json
  artifacts:
    reports:
      codequality: jinns/code-quality-report.json
  rules:
    - !reference [.default_rules, rules]

Ruff Format:
  extends: .base_ruff
  script:
    - ruff format jinns --diff
  rules:
    - !reference [.default_rules, rules]

run_tests:
  stage: tests
  before_script:
    - virtualenv venv
    - source venv/bin/activate
    - pip install pytest coverage pytest-cov
    - pip install -e .
  script:
    - pytest --cov=jinns
  coverage: '/TOTAL.*\s+(\d+%)$/'
  rules:
    - !reference [.default_rules, rules]

build_doc:
  stage: build
  needs: [] # don't need to wait for other jobs
  before_script:
    - virtualenv venv
    - source venv/bin/activate
    - pip install -e .
    - pip install -r docs/doc_requirements.txt
  script:
    - mkdocs build
    - mkdocs build  # twice, see https://github.com/patrick-kidger/pytkdocs_tweaks

  artifacts:
    untracked: true
    expire_in: 1 week
  tags:
    - saas-linux-small-amd64

build_package:
  stage: build
  image: "python:3.9"
  before_script:
    - pip install build
  script:
    - rm -rf dist/
    - python -m build
  artifacts:
    untracked: true
    expire_in: 1 week
  tags:
    - saas-linux-small-amd64
  rules:
    - !reference [.default_rules, rules]


publish_package:
  stage: publish
  image: "python:3.9"
  before_script:
    - pip install twine
  script:
    - TWINE_PASSWORD=${PYPI_UPLOAD_TOKEN}
      TWINE_USERNAME=__token__
      python -m twine upload dist/*
  tags:
    - saas-linux-small-amd64
  only:
    - tags
  rules:
    - !reference [.default_rules, rules]

pages:
  stage: publish
  image: "python:3.9"
  script:
    - rm -rf public/
    - cp -r site/ public/
  artifacts:
    paths:
    - public
  tags:
    - saas-linux-small-amd64
  only:
    - main
